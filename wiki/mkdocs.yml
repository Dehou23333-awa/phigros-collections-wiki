site_name: Phigros 收集品 Wiki
site_description: Phigros 全收集品资料库（五语言） · Generated from APK v1.5.4
copyright: >-
  Phigros © Pigeon Games · 数据自 APK 逆向提取，仅用于资料整理
theme:
  name: material
  language: zh
  icon:
    logo: material/book-open-page-variant
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.integrate
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: 'deep purple'
      accent: 'cyan'
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: 'deep purple'
      accent: 'cyan'
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
plugins:
  - search:
      lang:
        - en
        - zh
        - ja
        - ko
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: false
      languages:
        - locale: zh-Hans
          name: 简体中文
          default: true
          build: true
          site_name: Phigros 收集品 Wiki
