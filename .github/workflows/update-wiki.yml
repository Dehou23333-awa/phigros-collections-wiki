name: Update Wiki (auto)

# 全自动流水线：TapTap 下载最新 APK → 解包收集品数据 → 生成五语言 Wiki → 构建并部署 GitHub Pages
# 本仓库（公开）只保存免责声明与本工作流；wiki 源文档由 CI 在内存中生成，构建产物直接部署，不入库。
# 解包脚本从【私有仓库】拉取（见下方 checkout "Scripts (private)"）。

on:
  workflow_dispatch:              # 手动触发（Actions → Run workflow）
  schedule:                       # 每周一、四 04:00 UTC 自动检查新版本
    - cron: '0 4 * * 1,4'

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout public repo (config)
        uses: actions/checkout@v4

      # ---- 安全模型：脚本在私有仓库，公开仓库只保有免责声明与 CI 配置 ----
      - name: Fetch scripts from PRIVATE repo
        uses: actions/checkout@v4
        with:
          repository: Dehou23333-awa/phigros-collections-scripts   # 私有仓库（脚本）
          token: ${{ secrets.SCRIPTS_REPO_PAT }}                   # 私有仓库只读 PAT
          path: tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      # ---- ① 自动下载最新 APK（TapTap 免登录 API，MD5 校验；同版本自动跳过） ----
      - name: Fetch APK (TapTap)
        run: |
          python -X utf8 tools/01_fetch_apk.py \
            --apk "$GITHUB_WORKSPACE/apk/Phigros_latest.apk" \
            --apk-info "$GITHUB_WORKSPACE/apk/apk_info.json" \
            --source taptap \
          || { if [ -f apk/apk_info.json ]; then
                 echo "::warning::APK 下载失败，复用缓存版本信息重新构建";
               else
                 echo "::error::APK 下载失败且无缓存信息"; exit 1;
               fi; }

      # ---- ② 解包 + ③ 生成 & 构建 wiki（--skip-apk 复用刚才的 APK；site_url 修正多语言链接） ----
      - name: Unpack data + build wiki
        run: python -X utf8 tools/run_all.py --root "$GITHUB_WORKSPACE" --skip-apk \
               --site-url "https://dehou23333-awa.github.io/phigros-collections-wiki/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wiki/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4